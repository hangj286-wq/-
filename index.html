<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#faf9f6"><title>物語の書架 | 創作作品サイト</title>
<style>
:root{--bg:#faf9f6;--paper:#fff;--ink:#292b30;--sub:#6e727b;--line:#e8e5df;--accent:#4f657c;--accentbg:#eef2f5}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;line-height:1.8}button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.wrap{max-width:1040px;margin:auto;padding:0 22px}.topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.topinner{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:70px}.logo{font-family:Georgia,serif;font-size:22px;font-weight:700;letter-spacing:.06em}.logo small{font-family:system-ui;font-size:11px;color:var(--sub);font-weight:400;display:block;letter-spacing:.12em;margin-top:-8px}nav{display:flex;gap:5px;flex-wrap:wrap}nav button,.linkbtn{border:0;background:transparent;color:var(--sub);padding:9px 12px;border-radius:7px}nav button.active,nav button:hover,.linkbtn:hover{background:var(--accentbg);color:var(--accent)}main{min-height:72vh}.hero{padding:75px 0 60px;border-bottom:1px solid var(--line)}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--accent);font-weight:700}.hero h1{font-family:Georgia,'Yu Mincho','Hiragino Mincho ProN',serif;font-size:clamp(30px,5vw,51px);font-weight:500;line-height:1.55;margin:13px 0}.hero p{color:var(--sub);max-width:590px}.btn{background:var(--accent);color:#fff;border:1px solid var(--accent);padding:11px 20px;border-radius:7px}.btn.secondary{background:white;color:var(--accent)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.section{padding:45px 0}.section h2{font-size:22px;font-weight:600;margin:0 0 22px}.muted{color:var(--sub)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}.cover{height:165px;background:linear-gradient(145deg,#e4e8ed,#f3f1ed);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:44px;color:#82909d}.cover.alt{background:linear-gradient(145deg,#e9e5e1,#f5f2ee);color:#a29a90}.cover.third{background:linear-gradient(145deg,#e1e9e5,#f1f5f0);color:#819b8d}.cardbody{padding:20px;flex:1;display:flex;flex-direction:column}.tag{font-size:12px;color:var(--accent);background:var(--accentbg);border-radius:4px;padding:3px 8px;align-self:flex-start}.card h3{font-size:19px;margin:12px 0 6px}.card p{font-size:14px;color:var(--sub);margin:0 0 18px;flex:1}.textlink{border:0;background:none;color:var(--accent);font-weight:600;padding:0;text-align:left}.toolbar{display:flex;gap:12px;margin:0 0 24px;align-items:center;flex-wrap:wrap}.search{border:1px solid var(--line);background:#fff;padding:11px 14px;border-radius:7px;min-width:240px;flex:1}.empty{padding:30px;text-align:center;color:var(--sub)}.detail{max-width:780px;margin:auto}.back{border:0;background:none;color:var(--accent);padding:0 0 20px}.detailhead{padding:32px 0;border-bottom:1px solid var(--line)}.detailhead h1{font-family:Georgia,'Yu Mincho',serif;font-size:36px;font-weight:500;margin:12px 0}.chapterlist{background:#fff;border:1px solid var(--line);border-radius:10px;margin-top:24px}.chapter{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:17px 20px;border-bottom:1px solid var(--line)}.chapter:last-child{border:0}.reader{max-width:760px;margin:30px auto 70px}.readerbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:20px}.readerbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:clamp(22px,6vw,65px)}.readerbox h1{font-family:'Yu Mincho','Hiragino Mincho ProN',serif;font-size:25px;text-align:center;margin:0 0 40px}.prose{font-family:'Yu Mincho','Hiragino Mincho ProN',serif;font-size:var(--reader-size,18px);line-height:2.3;letter-spacing:.035em;white-space:pre-wrap;overflow-wrap:anywhere}.prose p{margin:0 0 1.5em}.readerbottom{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.charactergrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.character{background:#fff;border:1px solid var(--line);border-radius:10px;padding:23px}.character h3{margin:0 0 6px}.character .role{color:var(--accent);font-size:13px}.character p{color:var(--sub);font-size:14px;margin-bottom:0}.note{background:#fff;border:1px solid var(--line);border-radius:9px;padding:22px;color:var(--sub)}footer{border-top:1px solid var(--line);padding:30px 0;color:var(--sub);font-size:13px}.hidden{display:none!important}@media(max-width:720px){.topinner{align-items:flex-start;flex-direction:column;padding-top:12px;padding-bottom:10px;gap:8px}.grid{grid-template-columns:1fr}.charactergrid{grid-template-columns:1fr}.hero{padding:45px 0}.section{padding:30px 0}.cover{height:130px}.detailhead h1{font-size:29px}nav button{padding:7px 10px}}
</style>
</head>
<body>
<header class="topbar"><div class="wrap topinner"><a class="logo" href="#home">物語の書架<small>STORY ARCHIVE</small></a><nav aria-label="メインメニュー"><button data-go="home">ホーム</button><button data-go="works">作品一覧</button><button data-go="characters">登場人物</button></nav></div></header>
<main id="app" class="wrap" tabindex="-1"></main>
<footer><div class="wrap">© <span id="year"></span> 物語の書架 · このサイトの文章・作品の無断転載はご遠慮ください。</div></footer>
<script>
'use strict';
// 作品や登場人物の情報は、ここを編集してください。
const works=[
 {id:'wizardron',title:'ウィザードロン',genre:'ダークファンタジー / SF',symbol:'W',cover:'',description:'魔術と機械が交錯する世界。魔導科学の青年カーゴは、ある事件をきっかけに巨大な陰謀へ巻き込まれていく。',status:'連載中',chapters:[{id:'1',title:'第1話　始まりの歯車',body:`夜の街には、冷たい雨が降っていた。\n\nカーゴ・ウィーシスは、作業台の上に置かれた小さな機械を見つめていた。\n\n「これで、ようやく……」\n\n窓の向こうでは、都市ノヴァの灯りがぼんやりと滲んでいる。魔術と科学が交わるこの街で、彼が作ろうとしているものは、まだ誰も見たことのない未来だった。\n\n――ここから先はサンプル本文です。ご自身の原稿に差し替えてください。`},{id:'2',title:'第2話　都市ノヴァ',body:`都市ノヴァには、魔術師と非魔術師が暮らしている。\n\nしかし、互いの間にある溝は、決して浅いものではなかった。\n\n――この文章はサンプルです。実際の第2話の本文に置き換えてください。`}]},
 {id:'mansion',title:'殺し屋マンション',genre:'ミステリー / アクション',symbol:'M',cover:'alt',description:'一癖も二癖もある住人たちが暮らす、奇妙なマンション。そこで繰り広げられる事件と日常。',status:'準備中',chapters:[{id:'1',title:'第1話　奇妙な住人たち',body:`ここに『殺し屋マンション』の第1話を入力してください。\n\nこのページはサンプルです。`}]},
 {id:'new',title:'新しい物語',genre:'短編 / その他',symbol:'✦',cover:'third',description:'これから公開する作品のためのスペース。タイトルや紹介文を自由に変更できます。',status:'準備中',chapters:[{id:'1',title:'短編　はじまり',body:'ここに新しい作品の本文を入力してください。'}]}
];
const characters=[
 {name:'カーゴ・ウィーシス',work:'wizardron',role:'魔導科学の研究者',description:'非魔術師でありながら、卓越した魔導科学の才能を持つ青年。'},
 {name:'アモン・ウィーシス',work:'wizardron',role:'カーゴの兄',description:'魔術師。弟カーゴの研究と運命に深く関わる人物。'},
 {name:'マギア・ガレッド',work:'wizardron',role:'魔女',description:'白い髪と青い瞳を持つ魔術師。飄々とした態度の裏に、確かな信念を持つ。'},
 {name:'バルト・ジョーンズ',work:'wizardron',role:'アダマントの代表',description:'魔術師を危険視し、独自の信念で行動する男。'},
 {name:'ゴブリン',work:'mansion',role:'殺し屋',description:'謎の多い、単独で活動する殺し屋。'}
];
const app=document.getElementById('app');let searchText='';let readerSize=Number(localStorage.getItem('readerSize')||18);if(!Number.isFinite(readerSize))readerSize=18;readerSize=Math.max(15,Math.min(24,readerSize));
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const card=w=>`<article class="card"><div class="cover ${w.cover}">${escapeHTML(w.symbol)}</div><div class="cardbody"><span class="tag">${escapeHTML(w.genre)}</span><h3>${escapeHTML(w.title)}</h3><p>${escapeHTML(w.description)}</p><button class="textlink" data-href="work/${encodeURIComponent(w.id)}">作品を見る →</button></div></article>`;
const go=path=>{location.hash='#'+path};
function home(){app.innerHTML=`<section class="hero"><div class="eyebrow">WELCOME TO MY STORIES</div><h1>物語の世界へ、<br>ようこそ。</h1><p>オリジナル小説や創作作品を公開する、小さな書架です。気になる物語を、どうぞごゆっくり。</p><div class="actions"><button class="btn" data-href="works">作品を探す</button><button class="btn secondary" data-href="characters">登場人物を見る</button></div></section><section class="section"><h2>公開中の作品</h2><div class="grid">${works.map(card).join('')}</div></section><section class="section"><div class="note">このサイトは公開用のサンプルです。作品名・本文・登場人物は自由に編集できます。新しい話を追加することもできます。</div></section>`}
function listing(){app.innerHTML=`<section class="section"><div class="eyebrow">LIBRARY</div><h2>作品一覧</h2><div class="toolbar"><input id="search" class="search" type="search" placeholder="作品名・ジャンルで検索" aria-label="作品を検索" value="${escapeHTML(searchText)}"></div><div id="results" class="grid"></div></section>`;const input=document.getElementById('search');input.addEventListener('input',e=>{searchText=e.target.value;drawResults()});drawResults()}
function drawResults(){const q=searchText.trim().toLocaleLowerCase();const filtered=works.filter(w=>(w.title+' '+w.genre+' '+w.description).toLocaleLowerCase().includes(q));document.getElementById('results').innerHTML=filtered.length?filtered.map(card).join(''):'<div class="empty">該当する作品がありません。</div>'}
function workPage(w){app.innerHTML=`<section class="section detail"><button class="back" data-href="works">← 作品一覧に戻る</button><div class="detailhead"><span class="tag">${escapeHTML(w.genre)}</span><h1>${escapeHTML(w.title)}</h1><p>${escapeHTML(w.description)}</p><p class="muted">${escapeHTML(w.status)} · 全${w.chapters.length}話</p></div><h2 style="margin-top:35px">エピソード一覧</h2><div class="chapterlist">${w.chapters.map(ch=>`<div class="chapter"><span>${escapeHTML(ch.title)}</span><button class="textlink" data-href="read/${encodeURIComponent(w.id)}/${encodeURIComponent(ch.id)}">読む →</button></div>`).join('')}</div><div class="actions"><button class="btn secondary" data-href="characters/${encodeURIComponent(w.id)}">この作品の登場人物</button></div></section>`}
function reader(w,ch){const idx=w.chapters.indexOf(ch),prev=w.chapters[idx-1],next=w.chapters[idx+1];app.innerHTML=`<div class="reader"><button class="back" data-href="work/${encodeURIComponent(w.id)}">← ${escapeHTML(w.title)}の目次へ</button><div class="readerbar"><span class="muted">${escapeHTML(w.title)} · ${idx+1} / ${w.chapters.length}</span><div><button class="linkbtn" id="smaller" aria-label="文字を小さく">文字 −</button><button class="linkbtn" id="larger" aria-label="文字を大きく">文字 ＋</button></div></div><article class="readerbox"><h1>${escapeHTML(ch.title)}</h1><div class="prose" id="prose" style="--reader-size:${readerSize}px">${ch.body.split(/\n\s*\n/).map(p=>`<p>${escapeHTML(p)}</p>`).join('')}</div></article><div class="readerbottom">${prev?`<button class="btn secondary" data-href="read/${encodeURIComponent(w.id)}/${encodeURIComponent(prev.id)}">← 前の話</button>`:'<span></span>'}${next?`<button class="btn" data-href="read/${encodeURIComponent(w.id)}/${encodeURIComponent(next.id)}">次の話 →</button>`:`<button class="btn secondary" data-href="work/${encodeURIComponent(w.id)}">目次へ戻る</button>`}</div></div>`;document.getElementById('smaller').onclick=()=>resize(-1);document.getElementById('larger').onclick=()=>resize(1)}
function resize(delta){readerSize=Math.max(15,Math.min(24,readerSize+delta));localStorage.setItem('readerSize',readerSize);document.getElementById('prose').style.setProperty('--reader-size',readerSize+'px')}
function characterPage(filter){const chosen=characters.filter(c=>!filter||c.work===filter);app.innerHTML=`<section class="section"><div class="eyebrow">CHARACTERS</div><h2>登場人物紹介</h2><div class="toolbar"><button class="btn ${!filter?'':'secondary'}" data-href="characters">すべて</button>${works.map(w=>`<button class="btn ${filter===w.id?'':'secondary'}" data-href="characters/${encodeURIComponent(w.id)}">${escapeHTML(w.title)}</button>`).join('')}</div><div class="charactergrid">${chosen.map(c=>`<article class="character"><span class="role">${escapeHTML(works.find(w=>w.id===c.work)?.title||'')}</span><h3>${escapeHTML(c.name)}</h3><div class="role">${escapeHTML(c.role)}</div><p>${escapeHTML(c.description)}</p></article>`).join('')||'<p class="muted">まだ登場人物が登録されていません。</p>'}</div></section>`}
function route(){const parts=decodeURIComponent(location.hash.replace(/^#\/?/,'')).split('/').filter(Boolean);const page=parts[0]||'home';const w=works.find(x=>x.id===parts[1]);if(page==='home')home();else if(page==='works')listing();else if(page==='characters')characterPage(parts[1]);else if(page==='work'&&w)workPage(w);else if(page==='read'&&w){const ch=w.chapters.find(x=>x.id===parts[2]);if(ch)reader(w,ch);else notFound()}else notFound();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===(page==='work'||page==='read'?'works':page)));window.scrollTo(0,0);document.title=(w?w.title+' | ':'')+'物語の書架'}
function notFound(){app.innerHTML='<section class="section"><h2>ページが見つかりません</h2><button class="btn" data-href="home">ホームに戻る</button></section>'}
document.addEventListener('click',e=>{const target=e.target.closest('[data-href],[data-go]');if(target){go(target.dataset.href||target.dataset.go)}});window.addEventListener('hashchange',route);document.getElementById('year').textContent=new Date().getFullYear();route();
</script>
</body></html>
